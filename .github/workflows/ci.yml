name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (compilation, tests unitaires, tests de bout en bout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: xmllint (validation XSD des factures électroniques TEIF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Compilation
        run: npm run build
      - name: Tests de bout en bout (PostgreSQL réel, schéma créé par les migrations)
        env:
          E2E_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:e2e
      - name: Les entités et les migrations sont synchronisées
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/schema_check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE schema_check'
          npm run migration:run
          npm run migration:generate -- CiCheck | tee /tmp/migration-check.log
          grep -q "déjà à jour" /tmp/migration-check.log || { echo "::error::Une entité a changé sans migration : lancez « npm run migration:generate -- NomDeLaMigration » et commitez le fichier."; exit 1; }

  frontend:
    name: Interface (types, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      - name: Compilation
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend -t inovexa-backend .
      - run: docker build -f Dockerfile.frontend -t inovexa-frontend .
